[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edocs-ai"
version = "0.1.0"
description = "AI for eDocs+"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2.1.3",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
    "setuptools>=84.0.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
