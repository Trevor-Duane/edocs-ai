services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edocs-ai-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: edocs-ai-postgres
    environment:
      POSTGRES_DB: edocs_ai
      POSTGRES_USER: edocs_ai
      POSTGRES_PASSWORD: edocs_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edocs_ai -d edocs_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: